[project]
name = "tm-final-env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.0.0,<7",
    "beautifulsoup4>=4.14.2,<5",
    "duckdb>=1.4.2,<2",
    "gensim>=4.4.0,<5",
    "jupyter>=1.1.1,<2",
    "lxml>=6.0.2,<7",
    "matplotlib>=3.10.7,<4",
    "nltk>=3.9.2,<4",
    "pandas>=2.3.3,<3",
    "pip>=25.3,<26",
    "polars",
    "py7zr>=1.0.0,<2",
    "pyarrow>=22.0.0,<23",
    "pyldavis>=3.4.1,<4",
    "pyspark>=4.0.1,<5",
    "ruff>=0.14.5,<0.15",
    "scikit-learn>=1.7.2,<2",
    "seaborn>=0.13.2,<0.14",
    "spacy>=3.8.9,<4",
    "statsmodels>=0.14.5,<0.15",
    "tabulate>=0.9.0,<0.10",
    "wordcloud>=1.9.4,<2", "ipykernel>=7.1.0,<8",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
tm-final-env = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
polars = ">=1.35.1,<2"
